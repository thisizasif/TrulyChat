<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - TrulyChat</title>
  <link rel="stylesheet" href="../assets/css/pages/contact.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">TC</span>
        TrulyChat
      </a>
      <nav class="nav-links" data-nav-menu id="site-nav">
        <a data-nav href="about.html">About</a>
        <a data-nav href="contact.html">Contact</a>
        <div class="nav-mobile-actions">
          <button class="btn btn-ghost" type="button" data-theme-toggle>Dark mode</button>
          <a class="btn btn-ghost" href="../index.html">Back to home</a>
          <a class="btn btn-ghost" href="login.html">Log in</a>
          <a class="btn btn-primary" href="login.html#signup">Create account</a>
        </div>
      </nav>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-actions">
        <button class="btn btn-ghost" type="button" data-theme-toggle>Dark mode</button>
        <a class="btn btn-ghost" href="login.html">Log in</a>
        <a class="btn btn-primary" href="login.html#signup">Create account</a>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="section-title">
      <h2>Contact Us</h2>
      <p>Tell us about your team or request a demo.</p>
    </div>
    <div class="form-wrap" style="margin-top: 24px;">
      <form>
        <div>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Send message</button>
        <p class="small">This demo form can be wired to your support system.</p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <strong>TrulyChat</strong>
        <p class="small">Private rooms, professional conversations.</p>
      </div>
      <div>
        <div><a href="terms.html">Terms</a></div>
        <div><a href="privacy.html">Privacy</a></div>
      </div>
      <div>
        <div><a href="contact.html">Support</a></div>
        <div><a href="faq.html">Help Center</a></div>
      </div>
      <div class="small">&copy; <span data-year></span> TrulyChat</div>
    </div>
  </footer>

  <script type="module" src="../assets/js/pages/contact.js"></script>
</body>
</html>
